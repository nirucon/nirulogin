[package]
name = "nirulogin"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Minimal NIRUX X11 login greeter for greetd"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
x11rb = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
winit = { version = "0.29", default-features = false, features = ["x11", "rwh_06"] }
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
