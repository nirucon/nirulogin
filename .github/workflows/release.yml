name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Built on Debian 12 (glibc 2.36): a binary linked on the runner's own,
    # newer glibc does not start on Debian 12/13 or Void (NIRULOGIN 0.3.0).
    container: debian:bookworm-slim
    steps:
      - name: Build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git build-essential binutils >/dev/null
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Verify release identity
        run: |
          test "$(./target/release/nirulogin --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
      - name: Runs on glibc 2.36 (Debian 12) and newer
        run: |
          need=$(objdump -T target/release/nirulogin | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "highest glibc symbol: $need"
          test "$(printf '%s\n2.36\n' "$need" | sort -V | tail -n 1)" = 2.36
      - name: Collect assets
        run: |
          mkdir -p dist
          cp target/release/nirulogin dist/
          cp install.sh nirulogin-session nirulogin-power.rules nirulogin-layouts dist/
          cd dist && sha256sum nirulogin install.sh nirulogin-session nirulogin-power.rules nirulogin-layouts > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/nirulogin
            dist/install.sh
            dist/nirulogin-session
            dist/nirulogin-power.rules
            dist/nirulogin-layouts
            dist/SHA256SUMS
          generate_release_notes: true
